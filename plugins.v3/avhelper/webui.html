<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AV 资源管理</title>
<style>
:root{
  --bg:#0e1116; --bg2:#151a22; --bg3:#1c232d; --line:#28313d;
  --fg:#e6edf3; --fg2:#9aa7b4; --fg3:#6b7887;
  --acc:#4c9aff; --acc2:#2f6fd0; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --gold:#e3b341; --pink:#db61a2;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3542;border-radius:6px}

/* 顶栏（左上角不再放标题：宿主插件页已经写了「AV 资源助手」，重复多余） */
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.bellbadge{display:inline-block;background:var(--acc2);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px;min-width:16px;text-align:center;margin-left:6px}
.bellbadge.zero{display:none}
.searchbox{display:flex;align-items:center;gap:0;flex:1;max-width:420px}
.searchbox input{flex:1;background:var(--bg3);border:1px solid var(--line);border-right:none;border-radius:8px 0 0 8px;padding:7px 11px;color:var(--fg)}
.searchbox input:focus{outline:none;border-color:var(--acc)}
.searchbox button{background:var(--acc2);border-radius:0 8px 8px 0;padding:7px 14px;color:#fff;font-size:13px}
.searchbox button:hover{background:var(--acc)}
.spacer{flex:1}
.toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg3)}
.toggle button{padding:5px 12px;font-size:12px;color:var(--fg3)}
.toggle button.on{background:var(--acc2);color:#fff}
.ghost{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--fg2);background:var(--bg3);white-space:nowrap}
.ghost:hover{border-color:var(--acc);color:var(--fg)}
.ghost.on{border-color:var(--acc);color:var(--acc)}
.ghost:disabled{opacity:.45;cursor:not-allowed}

/* 导航 */
nav{display:flex;gap:2px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
nav button{padding:9px 14px;color:var(--fg3);border-bottom:2px solid transparent;font-size:13px;display:flex;align-items:center;gap:7px}
nav button.on{color:var(--fg);border-bottom-color:var(--acc)}
nav .pill{background:var(--acc2);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px;min-width:16px;text-align:center}
nav .pill.warn{background:var(--warn);color:#2b2100}

main{flex:1;overflow:auto;padding:14px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{padding:4px 12px;border-radius:6px;font-size:12px;color:var(--fg3)}
.tabs button.on{background:var(--acc2);color:#fff}
.hint{color:var(--fg3);font-size:12px}
.hint code{background:var(--bg3);padding:1px 5px;border-radius:4px}

/* 卡片墙 */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#1f2733,#2a3442);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:12px;text-align:center;padding:8px}
.badges{position:absolute;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:1px 6px;border-radius:4px;background:#0009;border:1px solid #fff2}
.badge.cn{background:#1f6f3f;border-color:#2ea043}
.badge.uc{background:#7a2f6a;border-color:#db61a2}
.badge.new{background:#8a5a00;border-color:var(--gold)}
.badge.lib{background:#1b4f7a;border-color:var(--acc)}
.card .meta{padding:8px 9px 10px}
.card .num{font-weight:700;font-size:13px}
.card .sub{color:var(--fg3);font-size:11px;margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.card .sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 演员 */
.actors{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
.actor{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.actor:hover{border-color:var(--pink);transform:translateY(-2px)}
.actor .av{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;overflow:hidden;background:#2a3442;border:2px solid var(--line)}
.actor .av img{width:100%;height:100%;object-fit:cover}
.actor .nm{font-size:13px;font-weight:600}
.actor .zh{font-size:11px;color:var(--fg3);min-height:16px}
.actor .star{position:absolute;right:8px;top:8px;font-size:14px}

/* 演员主页 */
.profile{display:flex;gap:18px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.profile .av{width:132px;height:132px;border-radius:12px;overflow:hidden;background:#2a3442;flex:none}
.profile .av img{width:100%;height:100%;object-fit:cover}
.profile h2{margin:0 0 4px;font-size:20px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--fg2);font-size:12px;margin-top:8px}
.kv b{color:var(--fg3);font-weight:400}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
/* 作品史：标准封面是竖版（约 147x200），卡面必须用竖版框 + contain，否则会被裁掉大半 */
.films{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}
.film{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s}
.film:hover{border-color:var(--pink);transform:translateY(-2px)}
.film .pic{aspect-ratio:3/4;background:#2a3442;overflow:hidden;position:relative}
.film .pic::before{content:'';position:absolute;inset:-10px;background-image:var(--bg,none);background-size:cover;background-position:center;filter:blur(16px);opacity:.5}
.film .pic img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.film .pic .noimg{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:12px;text-align:center;padding:8px}
.film .ft{padding:8px 10px 10px}
.film .fn{font-weight:700;font-size:13px}
.film .ftt{color:var(--fg2);font-size:11px;margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.film .fd{color:var(--fg3);font-size:11px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.filmyears{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filmyears button{padding:3px 11px;border-radius:999px;font-size:12px;color:var(--fg3);background:var(--bg3);border:1px solid var(--line)}
.filmyears button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.morebar{display:flex;justify-content:center;margin-top:16px}

/* 弹窗（影片详情：以图为主） */
.viewer{display:block}
.hero{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.hero .big{width:min(420px,46vw);flex:none}
.hero .big img{width:100%;display:block;border-radius:10px;cursor:zoom-in;background:#2a3442}
.hero .info{flex:1;min-width:260px}
.hero h2{margin:0 0 8px;font-size:24px}
.actorchips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.actorchip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-size:13px}
.actorchip:hover{border-color:var(--pink)}
.actorchip img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#2a3442}
.shots{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:6px}
/* 预览图横竖混排（实测 800×534 与 534×800 都有）：格子固定 16:9 铺满，图用 contain 完整显示，
   底下垫一层同图模糊底填满留白——固定比例 + cover 会把竖图裁掉一半 */
.shot{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#2a3442;cursor:zoom-in}
.shot::before{content:'';position:absolute;inset:-10px;background-image:var(--bg,none);background-size:cover;background-position:center;filter:blur(16px);opacity:.45}
.shots img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.shot .noimg{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:12px}
.longwrap{margin-top:8px}
.longwrap img{max-width:100%;display:block;border-radius:8px;cursor:zoom-in;background:#2a3442}
.longerr{color:var(--warn);font-size:12px;line-height:1.8}

/* Lightbox */
#lb{position:fixed;inset:0;background:#000e;z-index:80;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:6px}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff9;padding:16px;user-select:none}
#lb .nav:hover{color:#fff}
#lb .prev{left:8px} #lb .next{right:8px}
#lb .ctr{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fffc;font-size:13px;background:#0008;padding:4px 14px;border-radius:99px}
#lb .close{position:absolute;top:14px;right:20px;font-size:26px;color:#fffc}

/* 列表 / 表格 */
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:8px}
.row .mini{width:74px;height:100px;border-radius:6px;overflow:hidden;background:#2a3442;flex:none}
.row .mini img{width:100%;height:100%;object-fit:cover}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:700;font-size:14px}
.row .t2{color:var(--fg3);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.row .t2 em{font-style:normal;color:var(--fg2)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--fg3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #1e252f;vertical-align:middle}
tr.best td{background:#12291c}
tr.dead td{opacity:.42}
tr.bt td{background:#1a1a26}
/* 候选行副标题：种子原名（常写着无码/破解之类），排在规格/徽标那一行下面 */
tr.has-sub td{border-bottom:0}
tr.candsub td{padding:0 10px 9px;border-bottom:1px solid #1e252f}
tr.candsub .ttl{color:var(--fg3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--fg3);margin-right:4px}
.tag.on{background:#1f6f3f;border-color:#2ea043;color:#d7ffe4}
.tag.uc{background:#5c2450;border-color:#a44a92;color:#ffd9f4}
.tag.free{background:#4a3a00;border-color:var(--gold);color:#ffe9a8}
.tag.pref{background:#14324f;border-color:var(--acc);color:#cfe6ff}
.tag.lib{background:#1b4f7a;border-color:var(--acc);color:#dcecff}
.librow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:7px 12px;
  background:#11324a;border:1px solid var(--acc);border-radius:8px;font-size:13px;color:#dcecff}
.librow a{color:#9ecbff}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.hi{color:var(--ok)} .score.mid{color:var(--warn)} .score.lo{color:var(--fg3)}

.q{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.q .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.bar{height:7px;background:#222b36;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;transition:width .3s}
.bar.done i{background:linear-gradient(90deg,#2c7a3f,var(--ok))}
/* 任务 / 下载队列：番号旁边的小封面（只给番号认不出是哪一部） */
.tposter{position:relative;width:48px;height:64px;flex:none;border-radius:6px;overflow:hidden;background:#2a3442;border:1px solid var(--line)}
.tposter img{width:100%;height:100%;object-fit:cover;display:block}
.tposter .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:11px}
.thd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.thd .tno{font-weight:700;font-size:15px;letter-spacing:.2px}
.qhd{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.qhd .qn{font-weight:600;font-size:14px}
.qhd .right{margin-left:auto;text-align:right;white-space:nowrap}

/* 通知（Telegram 风格） */
.tg{max-width:660px}
.msg{display:flex;gap:10px;margin-bottom:14px}
.msg .ico{width:32px;height:32px;border-radius:50%;background:#2a6fb0;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.msg .bub{background:var(--bg2);border:1px solid var(--line);border-radius:2px 12px 12px 12px;padding:10px 13px;min-width:0;max-width:520px}
.msg .bub .h{font-size:11px;color:var(--acc);margin-bottom:4px;font-weight:600}
.msg .bub .b{font-size:13px;white-space:pre-line}
.msg .bub .f{font-size:11px;color:var(--fg3);margin-top:6px}
.msg .bub img{width:150px;border-radius:8px;margin-top:8px;display:block}
.msg.warn .ico{background:#8a6a10} .msg.warn .bub .h{color:var(--gold)}
.msg.ok .ico{background:#2c7a3f} .msg.ok .bub .h{color:var(--ok)}
.meta-line{font-size:11.5px;color:var(--fg2);background:var(--bg3);border-radius:6px;padding:6px 9px;margin-top:7px;line-height:1.7}

/* 抽屉 / 弹窗 */
.scrim{position:fixed;inset:0;background:#000a;display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1080px,96vw);background:var(--bg2);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer.ndrawer{width:min(470px,96vw)}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.drawer .db{overflow:auto;padding:18px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:42;width:min(640px,94vw);background:var(--bg2);border:1px solid var(--line);border-radius:12px;display:none;overflow:hidden}
.modal.on{display:block}
.modal.wide{width:min(920px,96vw)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
.modal .mb{padding:16px 18px;max-height:64vh;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--fg3);margin-bottom:5px}
.fld input[type=text],.fld input[type=number],.fld select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg3);background:var(--bg3);cursor:pointer}
.chip.on{border-color:var(--acc);background:#16324f;color:#cfe6ff}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #1e252f}
.sw:last-child{border-bottom:none}
.sw .lbl{font-size:13px}
.sw .dsc{font-size:11px;color:var(--fg3);margin-top:2px}
.primary{background:var(--acc2);color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600}
.primary:hover{background:var(--acc)}
.primary:disabled{background:#2a3442;color:var(--fg3);cursor:not-allowed}
.danger{border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--fg2)}
.danger:hover{border-color:var(--bad);color:var(--bad)}

#toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 14px;font-size:12.5px;max-width:360px;box-shadow:0 8px 26px #0008;animation:in .22s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)}
.toast b{display:block;font-size:11px;color:var(--fg3);font-weight:500;margin-bottom:2px}
@keyframes in{from{opacity:0;transform:translateX(14px)}}
/* 后台搜索完成的浮动提示：底部居中、依次向下排、各自计时、渐入渐出 */
#hints{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:59;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.hintItem{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--line);
  border-radius:999px;padding:7px 15px;font-size:12.5px;color:var(--fg2);box-shadow:0 8px 22px #0007;
  opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease}
.hintItem.on{opacity:1;transform:none}
.hintItem b{color:var(--fg);font-weight:600}
.hintItem .tick{color:var(--ok)}
.hintItem.warn .tick{color:var(--warn)}
.empty{color:var(--fg3);text-align:center;padding:48px 20px;font-size:13px;line-height:2}
.secttl{font-size:12px;color:var(--fg3);margin:20px 0 8px;letter-spacing:.4px}
.secttl:first-child{margin-top:0}
.searchrow{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:8px;cursor:pointer}
.searchrow:hover{border-color:var(--acc)}
.searchrow .mini{width:74px;height:100px;border-radius:6px;overflow:hidden;background:#2a3442;flex:none}
.searchrow .mini img{width:100%;height:100%;object-fit:cover}

/* 应用内提示：登录凭据 / 插件未启用 */
#authbar{display:none;flex:none;background:#3b1215;border-bottom:1px solid #7d2a24;color:#ffb4ad;
  font-size:12.5px;padding:7px 16px;align-items:center;gap:10px}
#authbar.on{display:flex}
#authbar .sp{flex:1}
#authbar button{border:1px solid #ffb4ad55;border-radius:6px;padding:2px 10px;font-size:12px;color:#ffd9d5}
#authbar button:hover{background:#ffffff14}
/* 长图 / 详情里的磁力行 */
.mag{border-bottom:1px solid #1e252f}
.mag:last-child{border-bottom:none}
.mag .mn{font-size:12.5px;line-height:1.5;word-break:break-all;margin:2px 0 4px}
.mag .mh{font-size:11px;color:var(--fg3);word-break:break-all}
.mag .mg{min-width:0;flex:1}
.loading{color:var(--fg3);text-align:center;padding:44px 20px;font-size:13px}
.errbox{background:#2a1416;border:1px solid #7d2a24;border-radius:var(--r);padding:20px 18px;text-align:center;color:#ffb4ad;font-size:13px;line-height:1.9}

/* ==========================================================================
   玻璃主题（追加覆盖层，位于最后；整段删掉即回到上面的深色实底主题）
   取值优先级：MoviePilot 真机 CSS 变量（页头脚本从同源父页拷进本文档）
              → MP dark / glass / clear 档的实测兜底值
   ========================================================================== */
:root{
  --g-primary:var(--v-theme-primary,141,81,249);
  --g-on:var(--v-theme-on-surface,231,227,252);
  --g-bg:var(--v-theme-background,11,19,34);
  --g-surface:var(--glass-surface,rgba(255,255,255,.10));
  --g-surface-soft:var(--glass-surface-soft,rgba(255,255,255,.09));
  --g-surface-raised:var(--glass-surface-raised,rgba(255,255,255,.12));
  --g-control:var(--glass-control,rgba(255,255,255,.09));
  --g-border:var(--glass-border,rgba(255,255,255,.14));
  --g-border-raised:var(--glass-border-raised,rgba(255,255,255,.18));
  --g-border-hover:var(--glass-border-hover,rgba(255,255,255,.28));
  --g-highlight:var(--glass-highlight,rgba(255,255,255,.22));
  --g-sheen:var(--glass-sheen,linear-gradient(135deg,rgba(255,255,255,7%),transparent 24%,rgba(255,255,255,2%) 72%,transparent));
  --g-shadow:var(--glass-shadow,0 10px 28px rgba(3,7,18,.24));
  --g-shadow-hover:var(--glass-shadow-hover,0 18px 44px rgba(3,7,18,.36));
  --g-blur:var(--glass-surface-backdrop-filter,blur(16px) saturate(145%));
  --g-blur-raised:var(--glass-raised-backdrop-filter,blur(32px) saturate(145%));
  --g-overlay:var(--glass-overlay-surface,rgba(14,17,22,.38));
  --g-overlay-blur:var(--glass-overlay-backdrop-filter,blur(32px) saturate(135%));
  --g-pill:var(--glass-nav-active-background,linear-gradient(90deg,rgba(var(--g-primary),.24),rgba(var(--g-primary),.5)));
  --g-nav-scrim:var(--glass-navbar-scrim,linear-gradient(rgba(7,14,25,.06),rgba(7,14,25,.14)));
  --g-edge:inset 0 1px 0 var(--g-highlight);
  --g-radius:var(--app-theme-surface-radius,14px);
  --g-motion:var(--glass-motion,.18s cubic-bezier(.2,.8,.2,1));
  --plate:rgba(var(--g-on),.07);
  /* 覆盖原主题变量：撤掉实底，改玻璃 */
  --bg:transparent; --bg2:var(--g-surface); --bg3:var(--g-control); --line:var(--g-border);
  --fg:rgb(var(--g-on)); --fg2:rgba(var(--g-on),.68); --fg3:rgba(var(--g-on),.5);
  --acc:rgb(var(--g-primary)); --acc2:rgb(var(--g-primary));
  --r:var(--g-radius);
}
/* 宿主是浅色主题时：MP 的玻璃是「墨色高不透明填充 + 白描边」，兜底值跟着切 */
html[data-mp-light]{
  --g-surface:var(--glass-surface,rgba(11,19,34,.26));
  --g-surface-soft:var(--glass-surface-soft,rgba(11,19,34,.28));
  --g-surface-raised:var(--glass-surface-raised,rgba(11,19,34,.33));
  --g-control:var(--glass-control,rgba(11,19,34,.52));
  --g-border:var(--glass-border,rgba(255,255,255,.10));
  --g-border-raised:var(--glass-border-raised,rgba(255,255,255,.14));
  --g-border-hover:var(--glass-border-hover,rgba(255,255,255,.22));
  --g-highlight:var(--glass-highlight,rgba(255,255,255,.18));
  --g-overlay:var(--glass-overlay-surface,rgba(11,19,34,.60));
  --plate:rgba(11,19,34,.10);
}
/* 嵌在 MoviePilot 里时：自己铺一层宿主主题色的底，**不透明**。
   MP 的插件页容器在 iframe 后面垫的不是干净底色：实测中段接近纯白、右段是一张模糊海报
   （暖色），只要留一点点透明，暗底上就会浮出斜向色块/横纹（用户实测截图确认过）。
   铺成不透明后，界面内部的玻璃感由面板自己的 surface/描边/高光提供，不再受宿主背景干扰。
   独立打开（非 iframe）时自带等效底。 */
html[data-mp-embed] body{
  background:rgb(11,19,34);
  background:rgb(var(--g-bg));
}
html:not([data-mp-embed]) body{
  background:
    radial-gradient(120% 90% at 8% -12%,rgba(141,81,249,.26),transparent 56%),
    radial-gradient(110% 85% at 102% -6%,rgba(22,177,255,.18),transparent 58%),
    #0e1116;
}
/* 顶栏 / 导航：玻璃条 */
header,nav{background-color:var(--g-surface-raised);background-image:var(--g-nav-scrim),var(--g-sheen);
  border-color:var(--g-border);box-shadow:var(--g-edge),0 6px 22px rgba(3,7,18,.16)}
header{position:relative;z-index:31}
nav{position:relative;z-index:30}
nav{gap:6px;padding:8px 12px}
nav button{padding:7px 14px;border-bottom:none;border-radius:10px}
nav button:hover{background:rgba(var(--g-on),.07);color:var(--fg2)}
nav button.on{color:#fff;background-image:var(--g-pill);box-shadow:var(--g-edge)}
/* 卡片 / 面板：玻璃填充 + 高光内边 */
.card,.actor,.film,.profile,.row,.q,.searchrow,.msg .bub,.actorchip,.meta-line{
  background-color:var(--g-surface);background-image:var(--g-sheen);
  border-color:var(--g-border);box-shadow:var(--g-edge);
}
.card:hover,.actor:hover,.film:hover,.searchrow:hover,.actorchip:hover{
  border-color:rgba(var(--g-primary),.55);box-shadow:var(--g-shadow-hover),var(--g-edge);
}
.card,.actor,.film,.row,.searchrow,.ghost,.chip,.tabs button,.toggle button,nav button,
.filmyears button,.primary,.actorchip{
  transition:background-color var(--g-motion),border-color var(--g-motion),
             box-shadow var(--g-motion),transform var(--g-motion),color var(--g-motion);
}
/* 图片占位底 */
.thumb,.primary:disabled{background:var(--plate)}
.actor .av,.profile .av,.film .pic,.hero .big img,.actorchip img,.shots img,.longwrap img,
.row .mini,.searchrow .mini,.tposter{background:var(--plate)}
.actor .av{border-color:var(--g-border-raised)}
.bar{background:rgba(var(--g-on),.12)}
/* 表格 / 列表 */
th,td,.mag,.sw{border-bottom-color:var(--g-border)}
tr.best td{background:rgba(86,202,0,.14)}
tr.bt td{background:rgba(var(--g-on),.05)}
/* 标签 / 徽标 */
.tag{background:rgba(var(--g-on),.05);border-color:var(--g-border)}
.tag.on{background:rgba(86,202,0,.18);border-color:rgba(86,202,0,.45);color:#d7ffe4}
.tag.uc{background:rgba(219,97,162,.20);border-color:rgba(219,97,162,.5);color:#ffd9f4}
.tag.free{background:rgba(227,179,65,.18);border-color:rgba(227,179,65,.5);color:#ffe9a8}
.tag.pref,.tag.lib{background:rgba(var(--g-primary),.22);border-color:rgba(var(--g-primary),.5);color:#ece7ff}
.badge.lib{background:rgba(var(--g-primary),.62);border-color:rgba(var(--g-primary),.9)}
.librow{background:rgba(var(--g-primary),.16);border-color:rgba(var(--g-primary),.45);color:#ece7ff}
.librow a{color:#c9bcff}
/* 控件 */
.ghost{background:var(--g-control);border-color:var(--g-border);color:var(--fg2)}
.ghost:hover{background:var(--g-surface-raised);border-color:var(--g-border-hover);color:var(--fg)}
.toggle,.tabs,.chip{background:var(--g-control);border-color:var(--g-border)}
.toggle button.on{background-image:var(--g-pill);background-color:transparent;color:#fff}
.chip.on{background:rgba(var(--g-primary),.24);border-color:rgba(var(--g-primary),.6);color:#fff}
.filmyears button{background:var(--g-control);border-color:var(--g-border)}
.filmyears button.on{background-image:var(--g-pill);border-color:transparent;color:#fff}
.searchbox input,.fld input[type=text],.fld input[type=number],.fld select{
  background:var(--g-control);border-color:var(--g-border);color:var(--fg)}
.searchbox input:focus,.fld input[type=text]:focus,.fld input[type=number]:focus,.fld select:focus{
  border-color:rgba(var(--g-primary),.7);box-shadow:0 0 0 3px rgba(var(--g-primary),.16);outline:none}
.primary{background:rgb(var(--g-primary));color:#fff;box-shadow:0 6px 18px rgba(var(--g-primary),.3)}
.primary:hover{background:rgb(var(--g-primary));filter:brightness(1.12)}
:focus-visible{outline:2px solid rgba(var(--g-primary),.75);outline-offset:2px}
/* 抽屉 / 弹窗 / 提示：磨砂玻璃 */
.scrim{background:rgba(3,7,18,.45)}
.drawer{background-color:var(--g-overlay);background-image:var(--g-sheen);
  -webkit-backdrop-filter:var(--g-overlay-blur);backdrop-filter:var(--g-overlay-blur);
  border-left:1px solid var(--g-border-raised);box-shadow:-30px 0 70px rgba(3,7,18,.45)}
.drawer .dh,.modal .mh,.modal .mf{border-color:var(--g-border)}
.modal{background-color:var(--g-overlay);background-image:var(--g-sheen);
  -webkit-backdrop-filter:var(--g-overlay-blur);backdrop-filter:var(--g-overlay-blur);
  border:1px solid var(--g-border-raised);border-radius:var(--g-radius);box-shadow:var(--g-shadow-hover)}
.toast{background-color:var(--g-overlay);background-image:var(--g-sheen);
  -webkit-backdrop-filter:var(--g-overlay-blur);backdrop-filter:var(--g-overlay-blur);
  border:1px solid var(--g-border);box-shadow:var(--g-shadow)}
.hintItem{background-color:var(--g-surface-raised);background-image:var(--g-sheen);
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);
  border:1px solid var(--g-border-raised);box-shadow:var(--g-shadow)}
/* 异常提示 */
#authbar{background:rgba(244,67,54,.18);border-bottom:1px solid rgba(244,67,54,.42);color:#ffc8c2}
#authbar button{border-color:rgba(255,180,173,.45);color:#ffd9d5}
.errbox{background:rgba(244,67,54,.14);border:1px solid rgba(244,67,54,.38);color:#ffc8c2}
::-webkit-scrollbar-thumb{background:rgba(var(--g-on),.18)}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--g-on),.28)}
</style>
<script>
/* 取 MoviePilot 真机主题变量：同源 iframe 里把父文档的 --v-theme-* / --glass-* 拷进本文档，
   主题色、玻璃透明度、模糊半径、圆角都跟着宿主走；拿不到（独立打开）时用 CSS 里的兜底值。 */
(function () {
  var R = document.documentElement;
  var VARS = {
    '--v-theme-primary': 'color', '--v-theme-on-surface': 'color', '--v-theme-background': 'color',
    '--glass-surface': 'color', '--glass-surface-soft': 'color', '--glass-surface-raised': 'color',
    '--glass-control': 'color', '--glass-border': 'color', '--glass-border-raised': 'color',
    '--glass-border-hover': 'color', '--glass-highlight': 'color', '--glass-overlay-surface': 'color',
    '--glass-sheen': 'background-image', '--glass-shadow': 'box-shadow',
    '--glass-shadow-hover': 'box-shadow',
    '--glass-surface-backdrop-filter': 'backdrop-filter',
    '--glass-raised-backdrop-filter': 'backdrop-filter',
    '--glass-overlay-backdrop-filter': 'backdrop-filter',
    '--glass-nav-active-background': 'background-image', '--glass-navbar-scrim': 'background-image',
    '--app-theme-surface-radius': 'border-radius'
  };
  function hostDoc() {
    try {
      var p = window.parent;
      if (p && p !== window && p.document && p.document.documentElement) return p.document;
    } catch (e) { /* 跨源：按独立页面处理 */ }
    return null;
  }
  function supported(prop, v) {
    try { return !!(window.CSS && CSS.supports(prop, v)); } catch (e) { return false; }
  }
  function okValue(prop, v) {   /* Vuetify 的主题色是 RGB 三元组（"141,81,249"），要套 rgb() 才算合法颜色 */
    if (supported(prop, v)) return true;
    return prop === 'color' && supported('color', 'rgb(' + v + ')');
  }
  function luma(t) {   /* "231,227,252" → 亮度；判断宿主是深色还是浅色 */
    var m = /^\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(t || '');
    return m ? (0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3]) / 255 : null;
  }
  function adopt() {
    var doc = hostDoc();
    if (!doc) return;
    var host = doc.querySelector('.v-application') || doc.body || doc.documentElement;
    var win = doc.defaultView || window;
    var cs = win.getComputedStyle(host), rs = win.getComputedStyle(doc.documentElement), n = 0;
    Object.keys(VARS).forEach(function (k) {
      var v = ((cs.getPropertyValue(k) || '').trim()) || ((rs.getPropertyValue(k) || '').trim());
      if (!v || v.length > 400 || v.indexOf('var(') >= 0) return;
      if (!okValue(VARS[k], v)) return;
      R.style.setProperty(k, v);
      n++;
    });
    var l = luma(R.style.getPropertyValue('--v-theme-on-surface'));
    if (l !== null) R.toggleAttribute('data-mp-light', l < 0.5);
    return n;
  }
  if (hostDoc()) {
    R.setAttribute('data-mp-embed', '');
    try {
      var fe = window.frameElement;   /* 同源才能拿到；让宿主页的 iframe 底变透明，壁纸透出来 */
      if (fe && fe.style) fe.style.background = 'transparent';
    } catch (e) { }
  }
  adopt();
  document.addEventListener('DOMContentLoaded', adopt);
  window.addEventListener('load', function () { setTimeout(adopt, 300); });
  try {
    var doc = hostDoc();
    if (doc && doc.documentElement && window.MutationObserver) {
      var mo = new MutationObserver(adopt);
      var opt = { attributes: true, attributeFilter: ['data-theme', 'data-glass-appearance', 'data-glass-quality',
        'data-glass-ui-style', 'data-glass-renderer-state', 'data-glass-navbar-refraction',
        'data-glass-background-visibility', 'class', 'style'] };
      mo.observe(doc.documentElement, opt);
      if (doc.body) mo.observe(doc.body, opt);
    }
  } catch (e) { }
})();
</script>
</head>
<body>

<script>
/* =========================================================================
 * AVHelper 前端应用（单文件，无外部依赖）
 * 后端基址：/api/v1/plugin/AVHelper ，除 /ui /img 外全部要 Authorization: Bearer <JWT>
 * 契约见 docs/AVHelper-API契约.md
 * ========================================================================= */
(function(){
'use strict';

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowStr = () => new Date().toLocaleTimeString('zh-CN',{hour12:false});
const normNum = s => String(s == null ? '' : s).replace(/[^A-Za-z0-9]/g,'').toUpperCase();

function toast(title, text, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = '<b>' + esc(title) + '</b>' + esc(text == null ? '' : text);
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 320); }, 4200);
}

/* 后台任务的小提示（搜索完成之类）：底部居中，新的排在下面，各条自己计时、渐入渐出 */
const HINT_MS = 2000;         // 停留时长（用户要求 2 秒）
const HINT_FADE = 320;        // 与 CSS 里的 transition 对齐
function hint(number, text, kind){
  const box = $('#hints');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'hintItem ' + (kind || '');
  el.innerHTML = '<b>' + esc(number || '') + '</b><span class="tick">'
    + (kind === 'warn' ? '•' : '✓') + '</span>' + esc(text || '已搜索完成');
  box.appendChild(el);
  while (box.children.length > 5) box.removeChild(box.firstChild);   // 连点也不至于糊满屏
  requestAnimationFrame(() => el.classList.add('on'));               // 下一帧再加 on，过渡才会走
  setTimeout(() => {
    el.classList.remove('on');
    setTimeout(() => el.remove(), HINT_FADE);
  }, HINT_MS);
}

/* 图片：加载失败时隐藏自身并显示相邻的 .noimg 占位 */
function imgTag(url, cls, alt){
  return '<img ' + (cls ? 'class="' + cls + '" ' : '') + 'src="' + esc(url || '') + '" alt="' + esc(alt || '') + '" loading="lazy" decoding="async"'
    + ' onerror="this.style.display=\'none\';this.nextElementSibling&&(this.nextElementSibling.style.display=\'flex\')">';
}
function imgWithPlaceholder(url, alt, cls){
  return imgTag(url, cls, alt) + '<div class="noimg" style="display:none">' + esc(alt || '无图') + '</div>';
}
const preload = urls => urls.forEach(u => { if (u) { const im = new Image(); im.decoding = 'async'; im.src = u; } });

/* ============ 鉴权：从 localStorage 里挖 JWT ============ */
const JWT_RE = /eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}/;
let TOKEN = null, TOKEN_TRIED = false;

function extractJwt(v){
  if (typeof v !== 'string' || v.length < 20) return null;
  const m = v.match(JWT_RE);
  return m ? m[0] : null;
}
function scanStorage(storage){
  try {
    for (let i = 0; i < storage.length; i++){
      const k = storage.key(i);
      if (k == null) continue;
      let hit = extractJwt(storage.getItem(k));
      if (!hit)   hit = extractJwt(k);              // 少数实现把 token 当 key
      if (hit) return hit;
    }
  } catch (e) { /* localStorage 不可用（跨源/被禁用）：忽略，后面会走 cookie 兜底 */ }
  return null;
}
function readToken(force){
  if (TOKEN && !force) return TOKEN;
  if (TOKEN_TRIED && !force) return TOKEN;
  TOKEN_TRIED = true;
  TOKEN = scanStorage(window.localStorage)
       || extractJwt(window.localStorage && window.localStorage.getItem('mp-token'))
       || scanStorage(window.sessionStorage)
       || extractJwt(document.cookie);
  if (!TOKEN) TOKEN = null;
  return TOKEN;
}
function showAuthBar(msg){
  $('#authbarText').textContent = msg || '未取到登录凭据，请重新登录 MoviePilot';
  $('#authbar').classList.add('on');
}
function hideAuthBar(){ $('#authbar').classList.remove('on'); }
/* MoviePilot 登录后会广播 mp-token 事件；若页面早于登录加载，这里能补上凭据 */
function bindTokenEvents(){
  ['mp-token','mp-token-updated','storage'].forEach(ev =>
    window.addEventListener(ev, () => { if (readToken(true)) { hideAuthBar(); } }));
}

/* ============ 接口层 ============ */
const API_BASE = '/api/v1/plugin/AVHelper';
const IMG_FALLBACK = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#1c232d"/>' +
  '<text x="50%" y="50%" fill="#6b7887" font-size="16" text-anchor="middle">图片加载失败</text></svg>');

function apiUrl(path, params){
  let u = API_BASE + path;
  const qs = [];
  Object.keys(params || {}).forEach(k => {
    const v = params[k];
    if (v === undefined || v === null || v === '') return;
    qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
  });
  return qs.length ? u + '?' + qs.join('&') : u;
}
async function request(method, path, params, body){
  const headers = {};
  const tk = readToken();
  if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const opt = { method: method, headers: headers, cache: 'no-store' };
  if (body !== undefined){
    headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  let resp;
  try { resp = await fetch(apiUrl(path, params), opt); }
  catch (e) { return { ok:false, message:'网络请求失败：' + (e && e.message ? e.message : e), net:true }; }
  if (resp.status === 401 || resp.status === 403){
    TOKEN = null; TOKEN_TRIED = false; readToken(true);
    showAuthBar('登录凭据已失效，请重新登录 MoviePilot');
    return { ok:false, message:'登录凭据已失效（HTTP ' + resp.status + '）', auth:true };
  }
  if (!resp.ok) return { ok:false, message:'请求失败（HTTP ' + resp.status + '）' };
  let js = null;
  try { js = await resp.json(); }
  catch (e) { return { ok:false, message:'返回内容不是合法 JSON（可能被网关改写）' }; }
  if (!js || typeof js !== 'object') return { ok:false, message:'返回内容为空' };
  if (js.success === false) return { ok:false, message: js.message || js.detail || '接口返回失败' };
  return { ok:true, data: (js.data !== undefined ? js.data : js) };
}

/* 详情预热：抓一次详情约 3 秒，先在后台按序取回来，点开时就是缓存命中。
   串行 1 条（不并发压多个 javdb 子进程）；失败不写错误条目，留给真正打开时报错重试。 */
const PRE = { queue:[], busy:false };
const PREFETCH_N = 6;             // 每屏后台预热前几张：调大=点开更快、后台开销更多
function prefetchDetail(num, id){
  if (!num || CACHE['detail:' + num]) return;
  if (PRE.queue.some(x => x.num === num)) return;
  PRE.queue.push({num:num, id:id || ''});
  pumpPrefetch();
}
function pumpPrefetch(){
  if (PRE.busy) return;
  const job = PRE.queue.shift();
  if (!job) return;
  if (CACHE['detail:' + job.num]){ pumpPrefetch(); return; }
  PRE.busy = true;
  apiGet('/detail', {number:job.num, id:job.id}).then(r => {
    if (r.ok) put('detail:' + job.num, {data:r.data || {}, t:Date.now()});
  }).catch(() => {}).then(() => { PRE.busy = false; pumpPrefetch(); });
}
function prefetchCards(root, n){
  root.querySelectorAll('.card, .film').forEach((c, i) => {
    if (i < n) prefetchDetail(c.dataset.num, c.dataset.id || '');
  });
}
function bindCards(root, sel){
  root.querySelectorAll(sel || '.card').forEach(c => {
    const num = c.dataset.num || '', id = c.dataset.id || '';
    c.onclick = () => openMovie(num, id);
    c.onmouseenter = () => prefetchDetail(num, id);   // 悬停即抢跑，点下去时多半已经在路上
  });
}

function copyText(text, btn){
  const done = () => toast('已复制', '磁力链接已复制到剪贴板');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('复制失败', '请手动选中链接复制', 'warn'); }

}
/* 长缩略图（剧情长图）：后端只解析 URL（/longimage，缓存 7 天），图片由浏览器直连加载。
   ⚠️ images.projectjav.com 校验 Referer：带本页地址（或 javdb 地址）一律 403，所以必须
   referrerpolicy="no-referrer"；浏览器直连不通（本机没走代理）时再退回插件图片代理 /img。 */
const LONG_STATE = {};   // number -> {url} 已拿到 | {err} 失败 | {loading:true} 解析中
function longHint(text, warn){
  return '<div class="hint"' + (warn ? ' style="color:var(--warn)"' : '') + '>' + esc(text) + '</div>';
}
function longFail(w, number, text, url){
  w.innerHTML = longHint(text, true)
    + (url ? '<div class="hint" style="word-break:break-all;margin-top:4px">' + esc(url) + '</div>' : '')
    + '<div style="margin-top:6px"><button class="ghost" id="btnLongRetry">重试</button></div>';
  w.querySelector('#btnLongRetry').onclick = () => loadLong(number, '', true);
}
function paintLong(w, number, url){
  w.innerHTML = longHint('⏳ 正在加载长缩略图…');
  const im = new Image();
  im.alt = '长缩略图';
  im.className = 'longimg';
  im.decoding = 'async';
  im.referrerPolicy = 'no-referrer';            // 关键：带 Referer 图床直接 403
  im.onload = () => { w.innerHTML = ''; w.appendChild(im); im.onclick = () => openLb([im.src], 0); };
  im.onerror = () => {
    if (im.dataset.fb !== '1'){ im.dataset.fb = '1'; im.src = apiUrl('/img', {url:url}); return; }
    longFail(w, number, '长缩略图加载失败：浏览器直连与插件代理都没取到。', url);
  };
  w.appendChild(im);
  im.src = url;
}
function loadLong(number, knownUrl, force){
  const w = $('#longWrap');
  if (!w || !number) return;
  if (force) delete LONG_STATE[number];            // 「重试」：连后端缓存一起绕过（/longimage?force=1）
  if (knownUrl) LONG_STATE[number] = {url: knownUrl};
  const st = LONG_STATE[number];
  if (st && st.url) return paintLong(w, number, st.url);
  if (st && st.err) return longFail(w, number, st.err, '');
  w.innerHTML = longHint('⏳ 正在获取长缩略图…');    // 首次解析要几秒，别让用户对着空位
  if (st && st.loading) return;                    // 已有请求在飞：等它回来统一重绘
  LONG_STATE[number] = {loading: true};
  apiGet('/longimage', force ? {number:number, force:1} : {number:number}).then(r => {
    const url = r.ok ? String((r.data && (r.data.url || r.data.longimage)) || '') : '';
    LONG_STATE[number] = r.ok
      ? (url ? {url: url} : {err: '该番号在 projectjav / javfree 里都没找到长图。'})
      : {err: '长图地址查询失败：' + (r.message || '请稍后重试')};
    const e = cached('detail:' + number);
    if (e && e.data) e.data.longimage = url;
    if ($('#drawer').classList.contains('on') && curDetail === number) loadLong(number);
  });
}

/* 缺封面的番号：串行、限量地补一次详情（结果缓存 7 天），补到就地换上。
   串行 = 同一时间只起一个 javdb 子进程（与详情预热同一条纪律）；限量 = 打开列表页不会打爆站点。
   只换图不重绘整块——用户可能正点着「下载」，重绘会把按钮状态打回去。 */
const TFILL = { queue:[], busy:false, tried:{} };
function queueThumb(number){
  const num = String(number || '');
  if (!num || TFILL.tried[num]) return;
  TFILL.tried[num] = true;
  TFILL.queue.push(num);
  pumpThumbFill();
}
function pumpThumbFill(){
  if (TFILL.busy) return;
  const num = TFILL.queue.shift();
  if (!num) return;
  TFILL.busy = true;
  apiGet('/detail', {number:num}).then(r => {
    const mv = (r.ok && r.data && r.data.movie) || null;
    if (mv && mv.thumb) applyThumb(num, mv.thumb);
  }).catch(() => {}).then(() => { TFILL.busy = false; pumpThumbFill(); });
}
function applyThumb(number, thumb){
  const same = x => x && String(x.number) === String(number);
  [].slice.call(document.querySelectorAll('.tposter[data-num]')).forEach(el => {
    if (el.dataset.num === String(number)) el.innerHTML = imgWithPlaceholder(thumb, '无图');
  });
  S.tasks.filter(same).forEach(t => { if (!t.thumb) t.thumb = thumb; });
  S.queue.filter(same).forEach(q => { if (!q.thumb) q.thumb = thumb; });
  if (same(S.siteTask) && !S.siteTask.thumb) S.siteTask.thumb = thumb;
}
/* 列表里凡是没图的番号，每轮最多补 3 个（补上的下一轮就不再排队） */
function queueMissingThumbs(items){
  (items || []).filter(x => x && x.number && !x.thumb).map(x => x.number).slice(0, 3).forEach(queueThumb);
}
/* 后台搜种：结果落进任务列表，但**不跳页**——只在底部给一条小提示，用户接着看手里的详情 */
function ptSearch(number, actor, thumb, btn){
  const body = {number:number};
  if (actor) body.actor = actor;
  if (thumb) body.thumb = thumb;      // 详情页顺手把封面带过去，任务列表里就有图了
  const done = () => { if (btn){ btn.disabled = false; btn.textContent = '🔎 搜索 PT 站'; } };
  apiPost('/tasks/search', body).then(r => {
    done();
    if (!r.ok){ toast('搜种失败', r.message || '抓取失败，请稍后重试', 'warn'); return; }
    const task = r.data && r.data.task ? r.data.task : r.data;
    if (task && task.id != null){
      S.tasks = S.tasks.filter(t => String(t.id) !== String(task.id));
      S.tasks.unshift(task);
    }
    renderPills();
    loadTasks(true);                  // 后台把任务列表刷好，角标跟着更新
    const n = task && task.cands ? task.cands.length : 0;
    hint((task && task.number) || number, n ? '已搜索完成' : '没有找到候选', n ? '' : 'warn');
  });
}
function startDownload(taskId, site, btn, force){
  if (btn) btn.disabled = true;
  apiPost('/tasks/download', force ? {id:taskId, site:site, force:true} : {id:taskId, site:site}).then(r => {
    if (!r.ok){
      if (btn) btn.disabled = false;
      toast('下载失败', r.message || '请稍后重试', 'warn');
      return;
    }
    const notice = r.data && r.data.notice ? r.data.notice : (r.data && r.data.id ? r.data : null);
    if (notice && (notice.body || notice.title)){ S.notices.unshift(notice); renderPills(); }
    toast('已提交下载', site + ' · 进度见「下载」页', 'ok');
    loadTasks(true);
  });
}
function loadTasks(force){
  return apiGet('/tasks').then(r => {

    if (Array.isArray(d.queue)) S.queue = d.queue;
    renderPills();
    if (S.view === 'tasks' || S.view === 'downloads') render();

  });
}

/* ---------- 7. 通知（顶栏铃铛 → 右侧抽屉） ---------- */
/* 「已读」只销角标、不删记录：通知永远留在列表里，铃铛上的数字只统计没看过的新通知。
   已读位点按本机记（localStorage，隐私模式下退回内存变量），看一次就一直归零，
   之后来的新通知才会重新把数字顶上去。 */
const SEEN_KEY = 'avh.noticesSeen';
let SEEN_MEM = '';
function noticeSeenAt(){
  try { return localStorage.getItem(SEEN_KEY) || SEEN_MEM; } catch (e) { return SEEN_MEM; }
}
function noticeUnread(){
  const seen = noticeSeenAt();
  return S.notices.filter(n => String(n.time || '') > seen).length;
}
function noticeMarkSeen(){
  const latest = S.notices.reduce((a, n) => (String(n.time || '') > a ? String(n.time) : a), noticeSeenAt());
  SEEN_MEM = latest;
  try { localStorage.setItem(SEEN_KEY, latest); } catch (e) { /* 写不了就只用内存位点 */ }
}
function notifyBodyHtml(){
  return '<div class="tg">'
    + (S.notices.length
      ? S.notices.map(n => {
          const kind = n.kind === 'ok' ? 'ok' : (n.kind === 'warn' ? 'warn' : '');
          return '<div class="msg ' + kind + '">'
            + '<div class="ico">🤖</div><div class="bub">'
            + '<div class="h">MoviePilot · ' + esc(n.type || '系统消息') + '</div>'
            + (n.title ? '<div style="font-weight:600;font-size:13px;margin-bottom:2px">' + esc(n.title) + '</div>' : '')
            + '<div class="b">' + esc(n.body || '') + '</div>'
            + (n.meta ? '<div class="meta-line">' + esc(n.meta) + '</div>' : '')
            + (n.image ? imgTag(n.image, '', '主图') + '<div class="noimg" style="display:none">主图加载失败</div>' : '')
            + '<div class="f">' + esc(shortTime(n.time)) + '</div>'
            + '</div></div>';
        }).join('')
      : '<div class="empty">暂无通知</div>')
    + '</div>';
}
function openNotify(){
  $('#drawer').classList.remove('on');
  $('#modal').classList.remove('on');
  $('#drawerReload').style.display = 'none';
  const nb = $('#nBody');
  nb.innerHTML = loadingHtml('加载中…');
  nb.scrollTop = 0;                     // 抽屉每次都是新开的一张，别继承上次的滚动位置
  $('#scrim').classList.add('on');
  $('#ndrawer').classList.add('on');
  loadNotices(false).then(ok => {       // 打开即算已读：角标清零，通知列表照旧全留着
    if (!ok) return;
    noticeMarkSeen();
    renderPills();
  });
}
function paintNotify(){
  if ($('#ndrawer').classList.contains('on')) $('#nBody').innerHTML = notifyBodyHtml();
}
function loadNotices(force){
  return apiGet('/notices').then(r => {
    if (!r.ok){ if (force) toast('通知读取失败', r.message || '', 'warn'); return false; }
    const d = r.data || {};
    S.notices = Array.isArray(d.notices) ? d.notices : (Array.isArray(d) ? d : S.notices);
    renderPills();
    paintNotify();
    return true;
  });
}

/* ---------- 搜索 ---------- */
function doSearch(kw){
  kw = (kw || '').trim(); if (!kw) return;
  openModal('搜索「' + kw + '」', loadingHtml('正在搜索…'), '<button class="danger" onclick="AVH.closeAll()">关闭</button>');
  $('#modal').classList.add('wide');
  apiGet('/search', {keyword:kw}).then(r => {
    const mb = $('#modalBody');
    if (!$('#modal').classList.contains('on')) return;
    if (!r.ok){ mb.innerHTML = errHtml(r.message || '搜索失败，请稍后重试', 'id="sRetry"'); const b = mb.querySelector('#sRetry'); if (b) b.onclick = () => doSearch(kw); return; }
    const d = r.data || {};
    const movies = d.movies || [];
    const actors = d.actors || [];
    $('#modalTitle').textContent = '搜索「' + kw + '」 · ' + movies.length + ' 部影片' + (actors.length ? ' / ' + actors.length + ' 位演员' : '');
    mb.innerHTML = (actors.length
        ? '<div class="hint" style="margin-bottom:8px">演员</div>'
          + '<div class="actors" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr));margin-bottom:16px">'
          + actors.map(a => '<div class="actor" data-n="' + esc(a.name) + '">'
              + '<div class="av">' + imgWithPlaceholder(a.avatar, a.name) + '</div>'
              + '<div class="nm">' + esc(a.name) + '</div><div class="zh">' + esc(a.zh || '') + '</div></div>').join('')
          + '</div>'
        : '')
      + (movies.length
        ? '<div class="hint" style="margin-bottom:8px">影片</div>'
          + movies.map(mv => '<div class="searchrow" data-num="' + esc(mv.number) + '" data-id="' + esc(mv.id || '') + '">'
              + '<div class="mini">' + imgTag(mv.thumb, '', mv.number) + '<div class="noimg" style="display:none">无图</div></div>'
              + '<div style="flex:1;min-width:0">'
              + '<div style="font-weight:700">' + esc(mv.number) + '</div>'
              + '<div class="hint" style="margin-top:3px">' + esc(mv.actor || '—') + ' · ' + esc(mv.date || '') + ' · 🧲 ' + (mv.magnets || 0)
              + (mv.cnsub ? '<span class="tag on">中字</span>' : '') + (mv.uncensored ? '<span class="tag uc">破解</span>' : '')
              + (mv.lib ? '<span class="tag lib">已入库</span>' : '') + '</div>'
              + '<div class="hint" style="margin-top:2px">' + esc((mv.title || '').slice(0, 60)) + '</div>'
              + '</div><span class="hint">查看 ›</span></div>').join('')
        : '<div class="hint">没有匹配的影片</div>');
    mb.querySelectorAll('.searchrow').forEach(el => el.onclick = () => { closeAll(); openMovie(el.dataset.num, el.dataset.id || ''); });
    mb.querySelectorAll('.actor').forEach(el => el.onclick = () => { closeAll(); openActor(el.dataset.n); });
    preload(movies.map(x => x.thumb));
  });
}

/* ---------- Lightbox ---------- */
let lbList = [], lbIdx = 0;
function openLb(list, idx){
  lbList = (list || []).filter(Boolean);
  if (!lbList.length) return;
  lbIdx = idx < 0 ? lbList.length - 1 : (idx || 0);
  if (lbIdx < 0 || lbIdx >= lbList.length) lbIdx = 0;
  showLb();
  $('#lb').classList.add('on');
}
function showLb(){
  $('#lbImg').src = lbList[lbIdx] || '';
  $('#lbCtr').textContent = (lbIdx + 1) + ' / ' + lbList.length;
}
function lbStep(d){
  if (!lbList.length) return;
  lbIdx = (lbIdx + d + lbList.length) % lbList.length;
  showLb();
}

/* ---------- 抽屉 / 弹窗 ---------- */
function closeAll(){
  $('#scrim').classList.remove('on');
  $('#drawer').classList.remove('on');
  $('#ndrawer').classList.remove('on');
  $('#modal').classList.remove('on');
  $('#modal').classList.remove('wide');
  $('#drawerReload').style.display = 'none';
}
function openDrawer(title, html){
  $('#drawerTitle').textContent = title;
  $('#drawerBody').innerHTML = html;
  $('#drawerBody').scrollTop = 0;       // 换一部片要从头看，不继承上一部的滚动位置
  $('#scrim').classList.add('on');
  $('#drawer').classList.add('on');
}
function openModal(title, body, foot){
  $('#modal').classList.remove('wide');
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = foot || '';
  $('#scrim').classList.add('on');
  $('#modal').classList.add('on');
}

/* ============ 启动 ============ */
function applyBootstrap(d){
  d = d || {};
  if (typeof d.enabled === 'boolean') S.enabled = d.enabled;
  if (Array.isArray(d.sites) && d.sites.length) S.sites = d.sites;
  if (Array.isArray(d.favs)) S.favs = d.favs;
  if (Array.isArray(d.subs)) S.subs = d.subs;
  if (Array.isArray(d.tasks)) S.tasks = d.tasks;
  if (Array.isArray(d.queue)) S.queue = d.queue;
  if (Array.isArray(d.notices)) S.notices = d.notices;
  if (Array.isArray(d.known)) S.known = new Set(d.known);
  if (d.defaultRule && typeof d.defaultRule === 'object') S.rule = Object.assign({}, DEFAULT_RULE, d.defaultRule);
  if (S.rule.sites && !S.rule.sites.length && S.sites.length){
    S.rule.sites = S.sites.slice(0, 5).map(s => s.name).filter(Boolean);
  }
  if (S.rule.prefSites && !S.rule.prefSites.length && S.sites.length){
    S.rule.prefSites = S.sites.slice(0, 2).map(s => s.name).filter(Boolean);
  }
}
/* 站点列表兜底：bootstrap 没给就单查 /sites（订阅规则弹窗要用） */
function ensureSites(){
  if (S.sites && S.sites.length) return Promise.resolve(true);
  return apiGet('/sites').then(r => {
    if (!r.ok) return false;
    const d = r.data || {};
    const list = Array.isArray(d.sites) ? d.sites : (Array.isArray(d) ? d : []);
    if (list.length) S.sites = list;
    return list.length > 0;
  });
}
function loadBootstrap(){
  return apiGet('/bootstrap').then(r => {
    if (!r.ok){ S.bootError = r.message || 'bootstrap 失败'; return false; }
    applyBootstrap(r.data);
    S.bootError = '';
    return ensureSites().then(() => true);
  });
}
/* 首屏：拉状态 → 重绘 */
function bootAndRender(){
  S.bootError = '';
  renderPills();
  return loadBootstrap().then(ok => {
    if (!readToken()) showAuthBar('未取到登录凭据，请重新登录 MoviePilot');
    if (!S.enabled) toast('插件未启用', '请先在 MoviePilot 插件设置里启用 AVHelper', 'warn');
    if (!ok && !S.bootError) S.bootError = '接口无响应';
    S.booted = true;
    render();
    if (ok) loadTasks(false);
    return ok;
  });
}
function loadSubs(force){
  return apiGet('/subs').then(r => {
    if (!r.ok){ if (force) toast('订阅读取失败', r.message || '', 'warn'); return false; }
    const d = r.data || {};
    if (Array.isArray(d.subs)) S.subs = d.subs;
    else if (Array.isArray(d)) S.subs = d;
    renderPills();
    if (S.view === 'subs') render();
    return true;
  });
}
function bindUi(){
  /* 重试按钮统一走事件委托：这些块会被反复重绘，逐个绑定容易漏 */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'rank-retry'){
      if (S.bootError && !cached('rank:' + S.period + ':' + S.kind)) bootAndRender();
      else loadDiscoverForce(true);
    } else if (act === 'detail-retry'){
      if (curDetail){ delete CACHE['detail:' + curDetail]; paintDetail(curDetail); }
    } else if (act === 'actor-retry'){
      if (S.actor){ delete CACHE['page:actor:' + S.actor]; render(); }
    } else if (act === 'picker-retry'){
      delete CACHE['actors'];
      openActorPicker();
    } else if (act === 'modal-close'){
      /* 弹窗里改过收藏（暂停了下层重绘），关窗时补一次 */
      closeAll();
      renderPills();
      render();
    }
  });
  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    S.view = b.dataset.v; S.actor = null;
    closeAll(); render();
    if (S.view === 'tasks' || S.view === 'downloads') loadTasks(false);
    if (S.view === 'subs') loadSubs(false);
  });
  $('#bellBtn').onclick = openNotify;
  $('#nClose').onclick = closeAll;
  $('#nClear').onclick = () => {
    apiDelete('/notices').then(r => {
      if (!r.ok){ toast('清空失败', r.message || '请稍后重试', 'warn'); return; }
      S.notices = []; renderPills(); paintNotify();
      toast('已清空', '通知已清空', 'ok');
    });
  };
  $('#authRetry').onclick = () => {
    const t = readToken(true);
    if (t){ hideAuthBar(); toast('已取到登录凭据', '正在重试接口…', 'ok'); loadBootstrap().then(() => render()); }
    else toast('仍未取到凭据', '请确认已在 MoviePilot 登录', 'warn');
  };
  $('#scrim').onclick = closeAll;
  $('#drawerClose').onclick = closeAll;
  $('#lbPrev').onclick = e => { e.stopPropagation(); lbStep(-1); };
  $('#lbNext').onclick = e => { e.stopPropagation(); lbStep(1); };
  $('#lbClose').onclick = () => $('#lb').classList.remove('on');
  $('#lb').onclick = e => { if (e.target.id === 'lb') $('#lb').classList.remove('on'); };
  $('#lbImg').onerror = () => { $('#lbCtr').textContent = (lbIdx + 1) + ' / ' + lbList.length + '（图片加载失败）'; };
  document.addEventListener('keydown', e => {
    if ($('#lb').classList.contains('on')){
      if (e.key === 'Escape'){ $('#lb').classList.remove('on'); return; }
      if (e.key === 'ArrowLeft'){ lbStep(-1); return; }
      if (e.key === 'ArrowRight'){ lbStep(1); return; }
    }
    if (e.key === 'Escape'){
      if ($('#modal').classList.contains('on') || $('#drawer').classList.contains('on')
          || $('#ndrawer').classList.contains('on')) closeAll();
    }
  });
  $('#qBtn').onclick = () => doSearch($('#qInput').value);
  $('#qInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(e.target.value); });
}

/* 挂到 window：HTML 内联事件（onclick）需要 AVH.openLb / AVH.closeAll */
window.AVH = {
  S:S, render:render, closeAll:closeAll, openMovie:openMovie, openActor:openActor,
  openLb:openLb, openActorPicker:openActorPicker, doSearch:doSearch,
  toast:toast, hint:hint, loadTasks:loadTasks,
  clearCache:function(prefix){ Object.keys(CACHE).forEach(k => { if (!prefix || k.indexOf(prefix) === 0) delete CACHE[k]; }); }
};
bindTokenEvents();
bindUi();
render();
startTaskPolling();
bootAndRender();
})();
</script>
</body>
